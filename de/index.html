  <style>
    .news-ticker {
      background: #123b82;
      color: white;
      padding: 10px 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 20px;
      margin-bottom: 4px;
      position: relative;
    }

    .news-track {
      display: inline-block;
      will-change: transform;
      transform: translateX(0);
      transition: transform 0.08s linear;
      padding-left: 100%;
    }

    .org-title {
      text-align: center;
      width: 100%;
      display: block;
      font-size: 1.3rem;
      line-height: 1.4;
      padding: 10px 5px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    @media (max-width: 600px) {
      .org-title {
        font-size: 1.5rem;
        padding: 15px 8px;
      }
    }
  </style>
